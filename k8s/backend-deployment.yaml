apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: taskflow-ai-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: SECRET_KEY
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: ANTHROPIC_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: taskflow
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000